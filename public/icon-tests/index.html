<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nutrient Icon Bake-Off</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      main {
        margin: 0 auto;
        max-width: 1280px;
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 12px;
        box-shadow: 0 1px 4px rgb(24 24 27 / 0.12);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 16px;
        margin-top: 18px;
      }
      .panel {
        border: 1px solid #d4d4d8;
        border-radius: 12px;
        background: white;
        padding: 14px;
      }
      .panel h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #09090b;
          color: #fafafa;
        }
        .panel {
          border-color: #27272a;
          background: #18181b;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./icon-bakeoff-board.png" alt="Nutrient icon bake-off comparison board" />
      <section class="grid" aria-label="Raw EPS preview sheets">
        <div class="panel">
          <h2>Pack 1 Preview</h2>
          <img src="./pack-1.png" alt="Cute color food sticker EPS preview" />
        </div>
        <div class="panel">
          <h2>Pack 2 Preview</h2>
          <img src="./pack-2.png" alt="Fast food doodle EPS preview" />
        </div>
        <div class="panel">
          <h2>Pack 3 Preview</h2>
          <img src="./pack-3.png" alt="Dense food object EPS preview" />
        </div>
      </section>
    </main>
  </body>
</html>
